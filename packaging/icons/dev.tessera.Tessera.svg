<?xml version="1.0" encoding="UTF-8"?>
<!-- A tessera: one tile of a mosaic, echoing the app's name. The detached
     tile is the phone, joining the larger surface that is the desktop. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C8CFF"/>
      <stop offset="1" stop-color="#4F6BE8"/>
    </linearGradient>
  </defs>
  <rect x="6"  y="6"  width="22" height="22" rx="5" fill="url(#g)"/>
  <rect x="32" y="6"  width="22" height="22" rx="5" fill="url(#g)" opacity="0.55"/>
  <rect x="6"  y="32" width="22" height="22" rx="5" fill="url(#g)" opacity="0.55"/>
  <rect x="34" y="34" width="24" height="24" rx="6" fill="url(#g)"
        stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="2.5"/>
</svg>
