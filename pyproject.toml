[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tessera"
version = "2.0.0"
description = "Android phone companion for Linux and Windows: notifications, messages, photos, screen and webcam"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.11"
authors = [{ name = "Tessera contributors" }]
keywords = ["android", "companion", "kde", "notifications", "webcam"]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Communications",
]

# On Linux PySide6 comes from the distribution package (python3-pyside6)
# rather than from PyPI: the RPM build must not pull a second copy of Qt into
# site-packages. On Windows there is no such package, so pip installs it.
dependencies = [
    "PySide6>=6.5; sys_platform != 'linux'",
    # Bluetooth audio from the phone on Windows, through AudioPlaybackConnection.
    "winrt-runtime>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Devices.Enumeration>=3.0; sys_platform == 'win32'",
    # The phone's presence beacon: lock when it walks away.
    "winrt-Windows.Devices.Bluetooth>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Devices.Bluetooth.Advertisement>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Media.Audio>=3.0; sys_platform == 'win32'",
    "winrt-Windows.ApplicationModel.Calls>=3.0; sys_platform == 'win32'",
    # The phone's storage in File Explorer, through the Cloud Files API and SFTP.
    "winrt-Windows.Storage>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Storage.Provider>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Security.Cryptography>=3.0; sys_platform == 'win32'",
    "paramiko>=3.2; sys_platform == 'win32'",
]

[project.optional-dependencies]
# What building the Windows executable needs, on top of the app itself.
windows = ["pyinstaller>=6.6"]

[project.gui-scripts]
tessera = "tessera.app:main"

[project.urls]
Homepage = "https://github.com/risen/tessera"

[tool.setuptools.packages.find]
include = ["tessera*"]

[tool.setuptools.package-data]
tessera = ["py.typed"]
